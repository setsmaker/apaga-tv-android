name: Matrix Bluetooth Radar · APK
on:
  push:
    branches: [bluetooth-matrix]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "No se encontró sdkmanager"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Descomprimir proyecto Matrix
        run: mkdir -p matrixbt && unzip -q matrixbt/source.zip -d matrixbt
      - name: Compilar APK Bluetooth
        run: cd matrixbt && gradle --no-daemon assembleDebug
      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Matrix-BT-Radar-APK
          path: matrixbt/app/build/outputs/apk/debug/app-debug.apk
