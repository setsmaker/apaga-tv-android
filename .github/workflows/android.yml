name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar plataforma Android
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "No se encuentra sdkmanager"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recopilar mandos de TV CC0
        shell: bash
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/Lucaslhm/Flipper-IRDB.git /tmp/flipper-irdb
          git -C /tmp/flipper-irdb sparse-checkout set TVs Universal_TV_Remotes
          python3 tools/generate_catalog.py
      - name: Verificar patrones IR en Java
        shell: bash
        run: |
          mkdir -p /tmp/apagatv-tests
          javac -d /tmp/apagatv-tests app/src/main/java/es/apagatv/IrCodes.java tests/IrCodesCheck.java
          java -cp /tmp/apagatv-tests IrCodesCheck
      - name: Compilar APK de instalación
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ApagaTV-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ir-catalog-report.txt
